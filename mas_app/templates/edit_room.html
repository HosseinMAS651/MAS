{% extends "base.html" %}
{% block content %}
<div class="head"><h1>ویرایش اتاق</h1></div>
<form method="post" action="/rooms/{{ room.id }}/edit" class="card stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>نام اتاق
    <input name="name" maxlength="160" value="{{ room.name }}" required>
  </label>
  <label>ظرفیت
    <input name="capacity" type="number" min="1" max="100" value="{{ room.capacity }}" required>
  </label>
  <p class="muted">کاهش ظرفیت فقط جایگاه‌های اضافی را حذف می‌کند و فایل‌های همان جایگاه‌ها نیز در صف حذف قرار می‌گیرند.</p>
  <button class="primary" type="submit">ذخیره</button>
</form>
{% endblock %}
