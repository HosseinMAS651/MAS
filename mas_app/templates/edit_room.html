{% extends "base.html" %}{% block content %}<div class="head"><h1>ویرایش ظرفیت اتاق</h1></div><form method="post" action="/rooms/{{ room.id }}/edit" class="card stack"><input type="hidden" name="csrf" value="{{ csrf }}"><label>نام اتاق<input name="name" maxlength="160" value="{{ room.name }}" required></label><label>ظرفیت<input name="capacity" type="number" min="1" max="100" value="{{ room.capacity }}" required></label><p class="muted">کاهش ظرفیت، سخنرانان جایگاه‌های حذف‌شده و فایل‌های غیرضبط همان جایگاه‌ها را حذف می‌کند.</p><button class="primary" type="submit">ذخیره</button></form>{% endblock %}
