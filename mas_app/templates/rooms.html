{% extends "base.html" %}
{% block content %}
<div class="head"><div><h1>اتاق‌های سخنرانی</h1><p class="muted">اتاق‌های متعلق به حساب شما</p></div><a class="primary" href="/rooms/new">＋ ایجاد اتاق</a></div>
<div class="grid">
{% for room in rooms %}
  <article class="card room-card">
    <a class="room-main" href="/rooms/{{ room.id }}">
      <h3>{{ room.name }}</h3>
      <p class="muted">{{ room.capacity }} جای سخنران</p>
    </a>
    <div class="room-actions">
      <a href="/rooms/{{ room.id }}/play">▶ پخش</a>
      <a href="/rooms/{{ room.id }}/edit">ویرایش</a>
      <form method="post" action="/rooms/{{ room.id }}/delete" onsubmit="return confirm('این اتاق و فایل‌های وابسته حذف شوند؟')">
        <input type="hidden" name="csrf" value="{{ csrf }}"><button class="link-danger" type="submit">حذف</button>
      </form>
    </div>
  </article>
{% else %}
  <div class="card empty">اتاقی وجود ندارد.</div>
{% endfor %}
</div>
{% endblock %}
