{% extends "base.html" %}
{% block content %}
<div class="head"><h1>ایجاد اتاق سخنرانی</h1></div>
<form method="post" action="/rooms/new" class="card stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>نام اتاق
    <input name="name" maxlength="160" required autofocus>
  </label>
  <label>تعداد سخنرانان
    <input name="capacity" type="number" min="1" max="100" value="5" required>
  </label>
  <button class="primary" type="submit">ایجاد اتاق</button>
</form>
{% endblock %}
