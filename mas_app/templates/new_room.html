{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>ساخت اتاق جدید</h1><p class="muted">نام و ظرفیت اولیه را تعیین کنید؛ جزئیات سخنران‌ها در مرحله بعد قابل ویرایش است.</p></div></div>
<form method="post" action="/rooms/new" class="card form-stack narrow">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>نام اتاق<input name="name" maxlength="160" required></label>
  <label>تعداد اولیه سخنران<input type="number" name="capacity" min="1" max="100" value="5" required></label>
  <div class="row gap"><button class="primary" type="submit">ساخت اتاق</button><a class="secondary" href="/rooms">انصراف</a></div>
</form>
{% endblock %}
