services:
  - type: web
    name: mas
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MAS_ENV
        value: production
      - key: MAS_COOKIE_SECURE
        value: "1"
      - key: MAS_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
