services:
  - type: web
    name: mas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MAS_ENV
        value: production
      - key: MAS_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MAS_STORAGE_DIR
        value: ./uploads
      - key: MAS_COOKIE_SECURE
        value: "true"

      - key: MAS_PUBLIC_BASE_URL
        sync: false
