[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:mas_app.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = [
  "B008",   # فراخوانی تابع در آرگومان پیش‌فرض — الگوی استاندارد FastAPI Depends()
  "SIM108", # سه‌خطی بودن گاهی خواناتر است
  "RET504", # return مستقیم مقدار، در سرویس‌ها خواناست
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"migrations/versions/*" = ["E501"]
