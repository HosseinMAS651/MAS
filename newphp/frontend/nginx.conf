# Nginx فرانت‌اند MAS: سرو SPA و پروکسی FastCGI برای API به کانتینر app.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # آپلود فایل تا سقف MAS (پیش‌فرض ۵۰MB) + حاشیهٔ multipart
    client_max_body_size 66m;

    # دارایی‌های هش‌شدهٔ Vite: کش طولانی‌مدت
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API و health-checkها به PHP-FPM
    location /api/ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_read_timeout 180s;
    }

    location = /health {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    location = /ready {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
